name: Verahelm Decision Envelope verifier
description: Verify one Decision Envelope offline; no evaluation or authorization is performed.
author: Verahelm Holdings LLC
inputs:
  envelope:
    description: Repository-relative path to the Decision Envelope
    required: true
  public-key:
    description: Repository-relative path to the Ed25519 public key
    required: true
  public-key-sha256:
    description: Trusted SHA-256 fingerprint supplied outside pull-request content
    required: true
  status:
    description: Optional repository-relative signed lifecycle-status document
    required: false
  status-max-age-seconds:
    description: Optional maximum age for the signed status; requires status
    required: false
  subject-id:
    description: Expected subject identifier
    required: true
  subject-version:
    description: Expected immutable subject-version digest
    required: true
  authority-id:
    description: Expected customer authority identifier from trusted configuration
    required: true
  scope-environment:
    description: Expected authorized environment from trusted configuration
    required: true
  scope-change:
    description: Expected authorized change identifier from trusted workflow context
    required: true
runs:
  using: node20
  main: action/index.mjs
branding:
  icon: check-square
  color: gray-dark
